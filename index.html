<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Lavi Growth" />
    <meta
      name="description"
      content="Lavi Growth adalah aplikasi local-first untuk pencatatan kesehatan keluarga, tumbuh kembang, pengingat, statistik, jurnal, dan backup data."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lavi Growth" />
    <meta
      property="og:description"
      content="Family health tracker local-first dengan multi-profile dan sinkronisasi opsional ke backend milik sendiri."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lavi Growth" />
    <meta
      name="twitter:description"
      content="Family health tracker local-first untuk pencatatan kesehatan keluarga."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />

    <title>Lavi Growth</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
                950: '#022c22'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              signature: ['Dancing Script', 'cursive']
            },
            animation: {
              'text-shimmer': 'text-shimmer 2.5s ease-out infinite alternate'
            },
            keyframes: {
              'text-shimmer': {
                '0%': { 'background-position': '0% 50%' },
                '100%': { 'background-position': '100% 50%' }
              }
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">
    <noscript>Lavi Growth membutuhkan JavaScript untuk dijalankan.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
