name: Bug report
description: Laporkan masalah yang dapat direproduksi
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Deskripsi
      description: Jelaskan masalah secara ringkas dan jelas.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka ...
        2. Pilih ...
        3. Terjadi ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / versi
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privasi
      options:
        - label: Saya memastikan laporan ini tidak berisi PIN, key, token, atau data kesehatan pribadi.
          required: true
